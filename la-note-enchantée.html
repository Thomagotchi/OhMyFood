<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <!-- Site Title and description -->
    <title>Ohmyfood</title>
    <meta name="description" content="Entreprise de commandes de repas en ligne.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Font Awesome import -->
    <script src="https://kit.fontawesome.com/b78ed65e3d.js" crossorigin="anonymous"></script>
    <!-- Styles -->
    <link rel="stylesheet" href="./styles/resets.css">
    <link rel="stylesheet" href="./styles/globals.css">
    <link rel="stylesheet" href="./styles/restaurant.css">
</head>

<body>
  <header class="header">
    <a href="/" class="back-arrow">
      <i class="fa-solid fa-arrow-left"></i>
    </a>
    <!-- Logo -->
    <img src="./assets/images/logo/ohmyfood@2x.svg" alt="Logo OhMyFood" class="logo">
  </header>
  <main>
    <div class="image-container">
      <img src="./assets/images/restaurants/stil-u2Lp8tXIcjw-unsplash.jpg" alt="La note enchantée">
    </div>
    <section class="menu">
      <form  class="wrapper">
        <div class="title-container">
          <!-- Hero Title -->                     
          <h1 class="title">La note enchantée</h1>
          <!-- Heart -->
          <div class="heart">
            <input type="checkbox" name="restaurant-heart" id="restaurant-heart">
            <label for="restaurant-heart">
              <i class="fa-regular fa-heart"></i>
            </label>
          </div>

        </div>
        <div class="menu-section">
          <div class="menu-title">
            <h2 class="title">ENTRÉES</h2>
            <div class="underline">
            </div>
          </div>
          <div class="menu-card">
            <input type="checkbox" id="first" name="first">
            <label for="first" class="menu-item">
              <span class="text-container">
                <span class="title">Ravioles de foie gras </span>
                <span class="item-description">Accompagnées de leur crème à la truffe</span>
              </span>
              <span class="price">25€</span>
              <span class="check">
                <i class="fa-solid fa-circle-check"></i>
              </span>
            </label>
          </div>
          <div class="menu-card">
            <input type="checkbox" id="second" name="second">
            <label for="second" class="menu-item">
              <span class="text-container">
                <span class="title">Caviar osciètre </span>
                <span class="item-description">Sur blini à la farine de blé noir</span>
              </span>
              <span class="price">35€</span>
              <span class="check">
                <i class="fa-solid fa-circle-check"></i>
              </span>
            </label>
          </div>
          <div class="menu-card">
            <input type="checkbox" id="third" name="third">
            <label for="third" class="menu-item">
              <span class="text-container">
                <span class="title">Homard et espuma de potiron</span>
                <span class="item-description">Marinés aux zestes d'orange</span>
              </span>
              <span class="price">20€</span>
              <span class="check">
                <i class="fa-solid fa-circle-check"></i>
              </span>
            </label>
          </div>
          <div class="menu-card">
            <input type="checkbox" id="fourth" name="fourth">
            <label for="fourth" class="menu-item">
              <span class="text-container">
                <span class="title">Foie gras de canard cuit entier</span>
                <span class="item-description">Confiture de figue et pain toasté</span>
              </span>
              <span class="price">35€</span>
              <span class="check">
                <i class="fa-solid fa-circle-check"></i>
              </span>
            </label>
          </div>
          <div class="menu-title">
            <h2 class="title">PLATS</h2>
            <div class="underline">
            </div>
          </div>
          <div class="menu-card">
            <input type="checkbox" id="fifth" name="fifth">
            <label for="fifth" class="menu-item">
              <span class="text-container">
                <span class="title">Noix de coquilles Saint-Jacques</span>
                <span class="item-description">Sur lit de purée de céleri-rave</span>
              </span>
              <span class="price">40€</span>
              <span class="check">
                <i class="fa-solid fa-circle-check"></i>
              </span>
            </label>
          </div>
          <div class="menu-card">
            <input type="checkbox" id="sixth" name="sixth">
            <label for="sixth" class="menu-item">
              <span class="text-container">
                <span class="title">Langoustine poêlée</span>
                <span class="item-description">Purée de patate douce</span>
              </span>
              <span class="price">35€</span>
              <span class="check">
                <i class="fa-solid fa-circle-check"></i>
              </span>
            </label>
          </div>
          <div class="menu-card">
            <input type="checkbox" id="seventh" name="seventh">
            <label for="seventh" class="menu-item">
              <span class="text-container">
                <span class="title">Mijoté de queue de bœuf </span>
                <span class="item-description">Et riz sauvage aux zestes de citron</span>
              </span>
              <span class="price">45€</span>
              <span class="check">
                <i class="fa-solid fa-circle-check"></i>
              </span>
            </label>
          </div>
          <div class="menu-title">
            <h2 class="title">DESSERTS</h2>
            <div class="underline">
            </div>
          </div>
          <div class="menu-card">
            <input type="checkbox" id="eighth" name="eighth">
            <label for="eighth" class="menu-item">
              <span class="text-container">
                <span class="title">Macaron noisette et chocolat</span>
                <span class="item-description">Glace au caramel brun et sel de Guérande</span>
              </span>
              <span class="price">18€</span>
              <span class="check">
                <i class="fa-solid fa-circle-check"></i>
              </span>
            </label>
          </div>
          <div class="menu-card">
            <input type="checkbox" id="ninth" name="ninth">
            <label for="ninth" class="menu-item">
              <span class="text-container">
                <span class="title">Baba au rhum revisité</span>
                <span class="item-description">Avec son coulis de citron</span>
              </span>
              <span class="price">22€</span>
              <span class="check">
                <i class="fa-solid fa-circle-check"></i>
              </span>
            </label>
          </div>
          <div class="menu-card">
            <input type="checkbox" id="tenth" name="tenth">
            <label for="tenth" class="menu-item">
              <span class="text-container">
                <span class="title">Tarte au citron meringuée </span>
                <span class="item-description">Déstructurée</span>
              </span>
              <span class="price">23€</span>
              <span class="check">
                <i class="fa-solid fa-circle-check"></i>
              </span>
            </label>
          </div>
        </div>
        <button class="cta">
          <span class="overlay"></span>
          <span class="text">Commander</span>
        </button>
      </form >
    </section>
  </main>

  <!-- Footer du site séparer en trois colonnes -->
  <footer class="footer">
    <h3 class="omf-logo">
      ohmyfood
    </h3>
    <div class="link-container">
      <a class="link style_1" href="">
        <i class="fa-solid fa-utensils fa-xs"></i>
        <p>Proposer un restaurant</p>
      </a>
      <a class="link style_1" href="">
        <i class="fa-solid fa-handshake-angle fa-xs"></i>
        <p>Devenir partenaire</p>
      </a>
      <a class="link style_2" href="">
        <p>Mentions légales</p>
      </a>
      <a class="link style_2" href= "mailto:name@email.com">
        <p>Contact</p>
      </a>
    </div>
  </footer>
</body>
</html>
