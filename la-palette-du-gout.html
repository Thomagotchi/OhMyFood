<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <!-- Site Title and description -->
    <title>Ohmyfood</title>
    <meta name="description" content="Entreprise de commandes de repas en ligne.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Font Awesome import -->
    <script src="https://kit.fontawesome.com/b78ed65e3d.js" crossorigin="anonymous"></script>
    <!-- Styles -->
    <link rel="stylesheet" href="./styles/resets.css">
    <link rel="stylesheet" href="./styles/globals.css">
    <link rel="stylesheet" href="./styles/restaurant.css">
</head>

<body>
  <header class="header">
    <a href="/" class="back-arrow">
      <i class="fa-solid fa-arrow-left"></i>
    </a>
    <!-- Logo -->
    <img src="./assets/images/logo/ohmyfood@2x.svg" alt="Logo OhMyFood" class="logo">
  </header>
  <main>
    <div class="image-container">
      <img src="./assets/images/restaurants/jay-wennington-N_Y88TWmGwA-unsplash.jpg" alt="La palette du goût">
    </div>
    <section class="menu">
      <form  class="wrapper">
        <div class="title-container">
          <!-- Hero Title -->                     
          <h1 class="title">La palette du goût</h1>
          <!-- Heart -->
          <div class="heart">
            <input type="checkbox" name="restaurant-heart" id="restaurant-heart">
            <label for="restaurant-heart">
              <i class="fa-regular fa-heart"></i>
            </label>
          </div>

        </div>
        <div class="menu-section">
          <div class="menu-title">
            <h2 class="title">ENTRÉES</h2>
            <div class="underline">
            </div>
          </div>
          <div class="menu-card">
            <input type="checkbox" id="first" name="first">
            <label for="first" class="menu-item">
              <span class="text-container">
                <span class="title">Fricassée d'escargots</span>
                <span class="item-description">Au piment d'Espelette </span>
              </span>
              <span class="price">25€</span>
              <span class="check">
                <i class="fa-solid fa-circle-check"></i>
              </span>
            </label>
          </div>
          <div class="menu-card">
            <input type="checkbox" id="second" name="second">
            <label for="second" class="menu-item">
              <span class="text-container">
                <span class="title">Foie gras de canard mi-cuit</span>
                <span class="item-description">Et ses copeaux de truffe noire</span>
              </span>
              <span class="price">35€</span>
              <span class="check">
                <i class="fa-solid fa-circle-check"></i>
              </span>
            </label>
          </div>
          <div class="menu-card">
            <input type="checkbox" id="third" name="third">
            <label for="third" class="menu-item">
              <span class="text-container">
                <span class="title">Œuf au plat</span>
                <span class="item-description">Assaisonné à la truffe sur lit de caviar</span>
              </span>
              <span class="price">20€</span>
              <span class="check">
                <i class="fa-solid fa-circle-check"></i>
              </span> 
            </label>
          </div>
          <div class="menu-title">
            <h2 class="title">PLATS</h2>
            <div class="underline">
            </div>
          </div>
          <div class="menu-card">
            <input type="checkbox" id="fourth" name="fourth">
            <label for="fourth" class="menu-item">
              <span class="text-container">
                <span class="title">Filet de bœuf aux herbes</span>
                <span class="item-description">Accompagné de sa ribambelle de légumes</span>
              </span>
              <span class="price">40€</span>
              <span class="check">
                <i class="fa-solid fa-circle-check"></i>
              </span>
            </label>
          </div>
          <div class="menu-card">
            <input type="checkbox" id="fifth" name="fifth">
            <label for="fifth" class="menu-item">
              <span class="text-container">
                <span class="title">Parmentier de queue de bœuf</span>
                <span class="item-description">À la truffe noire sur sa purée de panais</span>
              </span>
              <span class="price">35€</span>
              <span class="check">
                <i class="fa-solid fa-circle-check"></i>
              </span>
            </label>
          </div>
          <div class="menu-card">
            <input type="checkbox" id="sixth" name="sixth">
            <label for="sixth" class="menu-item">
              <span class="text-container">
                <span class="title">Filet de turbot</span>
                <span class="item-description">Aux agrumes</span>
              </span>
              <span class="price">44€</span>
              <span class="check">
                <i class="fa-solid fa-circle-check"></i>
              </span>
            </label>
          </div>
          <div class="menu-title">
            <h2 class="title">DESSERTS</h2>
            <div class="underline">
            </div>
          </div>
          <div class="menu-card">
            <input type="checkbox" id="seventh" name="seventh">
            <label for="seventh" class="menu-item">
              <span class="text-container">
                <span class="title">Paris-Brest</span>
                <span class="item-description">Revisité </span>
              </span>
              <span class="price">18€</span>
              <span class="check">
                <i class="fa-solid fa-circle-check"></i>
              </span>
            </label>
          </div>
          <div class="menu-card">
            <input type="checkbox" id="eigth" name="eigth">
            <label for="eigth" class="menu-item">
              <span class="text-container">
                <span class="title">Macaron au chocolat d'exception </span>
                <span class="item-description">Et glace à la vanille de Madagascar</span>
              </span>
              <span class="price">22€</span>
              <span class="check">
                <i class="fa-solid fa-circle-check"></i>
              </span>
            </label>
          </div>
          <div class="menu-card">
            <input type="checkbox" id="ninth" name="ninth">
            <label for="ninth" class="menu-item">
              <span class="text-container">
                <span class="title">Mousse au chocolat </span>
                <span class="item-description">Au piment d'Espelette et à la truffe noire</span>
              </span>
              <span class="price">23€</span>
              <span class="check">
                <i class="fa-solid fa-circle-check"></i>
              </span>
            </label>
          </div>
        </div>
        <button class="cta">
          <span class="overlay"></span>
          <span class="text">Commander</span>
        </button>
      </form >
    </section>
  </main>

  <!-- Footer du site séparer en trois colonnes -->
  <footer class="footer">
    <h3 class="omf-logo">
      ohmyfood
    </h3>
    <div class="link-container">
      <a class="link style_1" href="">
        <i class="fa-solid fa-utensils fa-xs"></i>
        <p>Proposer un restaurant</p>
      </a>
      <a class="link style_1" href="">
        <i class="fa-solid fa-handshake-angle fa-xs"></i>
        <p>Devenir partenaire</p>
      </a>
      <a class="link style_2" href="">
        <p>Mentions légales</p>
      </a>
      <a class="link style_2" href= "mailto:name@email.com">
        <p>Contact</p>
      </a>
    </div>
  </footer>
</body>
</html>
